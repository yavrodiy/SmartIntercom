esphome:
  name: intercom-v2
  friendly_name: intercom v2
  comment: "SmartIntercom Nelma 4E"
  libraries:
    - Improv=https://github.com/SCratORS/FTPClientServer

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      flash_chip: generic
      disable_vfs_support_dir: false
  partitions: lib/partitions_esp32.csv
  
# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "VXPi/U2vUL427Z5oP12eQdQGtXpZagTAhwSk67IDmtI="
  actions:
    # Accept call service for Home Assistant
    - action: accept_call
      then:
        - logger.log: "Call service 'Accept Call'"
        - if:
            condition:
              binary_sensor.is_on: incoming_call
            then:
              script.execute: accepting
            else:
              logger.log: "No incoming call"
    # Accept delivery call service for Home Assistant
    - action: accept_call_delivery
      then:
        - logger.log: "Call service 'Accept Call Delivery'"
        - if:
            condition:
              binary_sensor.is_on: incoming_call
            then:
              script.execute: accepting_delivery
            else:
              logger.log: "No incoming call"
    # Reject call service for Home Assistant
    - action: reject_call
      then:
        - logger.log: "Call service 'Reject Call'"
        - if:
            condition:
              binary_sensor.is_on: incoming_call
            then:
              script.execute: rejecting
            else:
              logger.log: "No incoming call"

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on
  ap:
    ssid: "Intercom-V2 Fallback Hotspot"
    password: !secret wifi_password
captive_portal:

substitutions:
  dev_name: intercom_v2

  led_status: GPIO16                   # Встроенный светодиод
  led_indicator: GPIO13                # Дополнительный индикатор, который будет показывать режимы и прочее.
  detect_line: GPIO12                  # Пин детектора вызова
  button_boot: GPIO0                   # Кнопка управления платой и перевода в режим прошивки
  relay_switch_line: GPIO14            # Пин "Переключение линии, плата/трубка"
  switch_open: GPIO17                  # Пин "Открытие двери"
  switch_phone: GPIO4                  # Пин "Трубка положена/поднята"
  
  call_end_detect_delay: 3500ms        # Интервал для детектирования вызова
  delay_answer_time: 600 ms            # Интервал между взятием трубки и ответом 
  delay_open_time: 300ms               # Интервал времени нажатия кнопки
  delay_after_open: 500ms              # Интервал между открытием двери и завершением звонка
  delay_before_voice: 400ms            # Интервал перед началом воспроизведения
  delay_before_open_door: 100ms        # Интервал между воспроизведением аудио и нажатием кнопки

  #Аудио
#  play_user_greeting: playFile(audio_player, "/user_greeting.mp3")
#  play_user_access_allowed: playFile(audio_player, "/user_access_allowed.mp3")
#  play_delivery_access_allowed: playFile(audio_player, "/delivery_access_allowed.wav")
#  play_access_denied: playFile(audio_player, "/access_denied.mp3")
#  play_friends: playFile(audio_player, "/friends.wav")

  play_user_access_allowed: id(audio_player).play("/user_access_allowed.mp3")
  play_delivery_access_allowed: id(audio_player).play("/delivery_access_allowed.wav")
  play_access_denied: id(audio_player).play("/access_denied.mp3")
  play_friends: id(audio_player).play("/friends.wav")
  play_user_greeting: id(audio_player).play("/user_greeting.mp3")


external_components:                   # fix for removal of custom component in esphome 2025.xx and up
  - source:
      type: local
      path: my_components
    components: [esputils]
  - source:
      type: local
      path: my_components
    components: [espaudio]

espaudio:
  id: audio_player

esputils:
  id: ftp_server
  username: ""
  password: ""

status_led:
  pin: $led_status

text_sensor:
  - platform: esputils
    name: ${dev_name}_fs_free
    icon: "mdi:micro-sd"
    entity_category: diagnostic
    update_interval: 60s

number:
  # Интервал времени от звонка до взятия трубки
  - platform: template
    name: "Delay Before Answer"
    icon: "mdi:clock-time-two-outline"
    id: delay_before_answer
    optimistic: true
    restore_value: true
    mode: box
    unit_of_measurement: "мс"
    entity_category: "config"
    initial_value: 2525
    min_value: 100
    max_value: 5000
    step: 25

binary_sensor:
  # Call detection
  - platform: gpio
    name: "Incoming call"
    id: incoming_call
    pin:
      number: $detect_line
      mode: INPUT_PULLUP
      inverted: True
    filters:
      delayed_off: $call_end_detect_delay
    on_press:
      then:
        - logger.log: "Incoming call detected"
        - script.execute: state_call
    on_release:
      then:
        - output.turn_off: relay_switch_line
        - logger.log: "Incoming call completed"  

output:
  - platform: gpio
    id: relay_switch_line
    pin:
      number: $relay_switch_line
      mode: OUTPUT
  - platform: gpio
    id: open_door
    pin:
      number: $switch_open
      mode: OUTPUT
  - platform: gpio
    id: phone_up
    pin:
      number: $switch_phone
      mode: OUTPUT
      inverted: true

switch:
  - platform: template
    name: ${dev_name}_automatically open
    id: auto_open
    icon: "mdi:door-open"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.turn_off: auto_open_once
      - switch.turn_off: auto_reject
      - switch.turn_off: delivery
      - switch.turn_off: mute
      - switch.turn_off: friends 
      - logger.log: "Accept call switch is ON"

  - platform: template
    name: ${dev_name}_automatically open once
    id: auto_open_once
    icon: "mdi:door-open"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.turn_off: auto_open
      - switch.turn_off: auto_reject
      - switch.turn_off: delivery
      - switch.turn_off: mute
      - switch.turn_off: friends 
      - logger.log: "Accept call once switch is ON"

  - platform: template
    name: ${dev_name}_reject_call
    id: auto_reject
    icon: "mdi:phone-hangup"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.turn_off: auto_open
      - switch.turn_off: auto_open_once
      - switch.turn_off: delivery
      - switch.turn_off: mute
      - switch.turn_off: friends 
      - logger.log: "Reject call switch is ON"

  - platform: template
    name: ${dev_name}_delivery
    id: delivery
    icon: "mdi:package"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.turn_off: auto_open
      - switch.turn_off: auto_open_once
      - switch.turn_off: auto_reject
      - switch.turn_off: mute
      - switch.turn_off: friends 
      - logger.log: "Delivery mode switch is ON"      

  - platform: template
    name: ${dev_name}_mute
    id: mute
    icon: "mdi:bell-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.turn_off: auto_open
      - switch.turn_off: auto_open_once
      - switch.turn_off: auto_reject
      - switch.turn_off: delivery
      - switch.turn_off: friends 
      - logger.log: "Mute mode switch is ON"
                        
  - platform: template
    name: ${dev_name}_sound
    id: sound
    icon: "mdi:volume-high"
    entity_category: "config"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: ${dev_name}_friends
    id: friends
    icon: "mdi:account-group"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.turn_off: auto_open
      - switch.turn_off: auto_open_once
      - switch.turn_off: auto_reject
      - switch.turn_off: delivery
      - switch.turn_off: mute   
      - logger.log: "Mute mode switch is ON"

script:
  - id: state_call
    then:
      - if:
          condition:
            switch.is_on: auto_open
          then:
            - output.turn_off: phone_up
            - script.execute: accepting
      - if:
          condition:
            switch.is_on: auto_reject
          then:
            - output.turn_off: phone_up
            - script.execute: rejecting
      - if:
          condition:
            switch.is_on: auto_open_once
          then:
            - output.turn_off: phone_up
            - script.execute: accepting
            - delay: 1s
            - switch.turn_off: auto_open_once
      - if:
          condition:
            switch.is_on: delivery
          then:
            - output.turn_off: phone_up
            - script.execute: accepting_delivery
            - delay: 1s
            - switch.turn_off: delivery
      - if:
          condition:
            switch.is_on: mute
          then:
            - output.turn_off: phone_up
            - output.turn_on: relay_switch_line
      - if:
          condition:
            switch.is_on: friends
          then:
            - output.turn_off: phone_up
            - script.execute: accepting_friends           

  # Accept incoming call
  - id: accepting
    then:
      - logger.log: "Accept call"
      - output.turn_on: relay_switch_line
      - delay: !lambda "return id(delay_before_answer).state;"
      - output.turn_on: phone_up
      - if:
          condition:
            switch.is_on: sound
          then:
            - delay: ${delay_before_voice}
            - lambda: ${play_user_access_allowed};
            - wait_until:
                lambda: 'return !id(audio_player).is_playing();'
            - delay: $delay_before_open_door
          else:
            delay: ${delay_answer_time}                   
      - output.turn_on: open_door
      - delay: ${delay_open_time}
      - output.turn_off: open_door
      - delay: ${delay_after_open}
      - output.turn_off: phone_up
      - homeassistant.event:
          event: esphome.intercom_call_accept
          data:
           entity_uid: Intercom  
  
  # Accept incoming call delivery
  - id: accepting_delivery
    then:
      - logger.log: "Accept Delivery call"
      - output.turn_on: relay_switch_line
      - delay: !lambda "return id(delay_before_answer).state;"
      - output.turn_on: phone_up
      - delay: ${delay_before_voice}
      - lambda: ${play_delivery_access_allowed};
      - wait_until:
          lambda: 'return !id(audio_player).is_playing();'
      - delay: $delay_before_open_door
      - output.turn_on: open_door
      - delay: ${delay_open_time}
      - output.turn_off: open_door
      - delay: ${delay_after_open}
      - output.turn_off: phone_up
      - homeassistant.event:
          event: esphome.intercom_call_accept_delivery
          data:
           entity_uid: Intercom 

  #Accept incoming call friends
  - id: accepting_friends
    then:
      - logger.log: "Accept call"
      - output.turn_on: relay_switch_line
      - delay: !lambda "return id(delay_before_answer).state;"
      - output.turn_on: phone_up
      - delay: ${delay_before_voice}
      - lambda: ${play_friends};
      - wait_until:
          lambda: 'return !id(audio_player).is_playing();'
      - delay: $delay_before_open_door                   
      - output.turn_on: open_door
      - delay: ${delay_open_time}
      - output.turn_off: open_door
      - delay: ${delay_after_open}
      - output.turn_off: phone_up
      - homeassistant.event:
          event: esphome.intercom_call_accept_friends
          data:
           entity_uid: Intercom 

  # Reject incoming call
  - id: rejecting
    then:
      - logger.log: "Reject call"
      - output.turn_on: relay_switch_line
      - delay: !lambda "return id(delay_before_answer).state;"
      - output.turn_on: phone_up
      - if:
          condition:
            switch.is_on: sound
          then:
            - delay: ${delay_before_voice}
            - lambda: ${play_access_denied};
            - wait_until:
                lambda: 'return !id(audio_player).is_playing();'
            - delay: $delay_before_open_door                  
          else:
            delay: ${delay_answer_time} 
      - output.turn_off: phone_up
      - homeassistant.event:
          event: esphome.intercom_call_reject
          data:
           entity_uid: Intercom